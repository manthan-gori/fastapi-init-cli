[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-init-cli"
version = "1.0.3"
description = "A production-ready interactive CLI generator for modern FastAPI backends."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "FastAPI Init Team" }
]
keywords = ["fastapi", "cli", "scaffold", "generator", "async", "sqlalchemy", "jwt", "oauth"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "questionary>=2.0.1",
    "pydantic[email]>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
fastapi-init = "fastapi_init_cli.main:app"
fastapi-init-cli = "fastapi_init_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_init_cli"]
include = [
    "fastapi_init_cli/templates/**",
]
